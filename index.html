<!doctype html>
<html lang="en">
  <head>
    <script>
      (() => {
        try {
          const root = document.documentElement;
          root.dataset.theme = localStorage.getItem("sweetcost-tema") || "claro";
          root.dataset.fontSize = localStorage.getItem("sweetcost-tamano-texto") || "medio";
          root.dataset.colorVision = localStorage.getItem("sweetcost-daltonismo") || "normal";
          root.dataset.contrast = localStorage.getItem("sweetcost-alto-contraste") === "true" ? "alto" : "normal";
        } catch (_) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logoSC.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sweet Cost</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  
    <svg aria-hidden="true" width="0" height="0" style="position:absolute;pointer-events:none">
      <defs>
        <filter id="sc-protanopia" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="0.567 0.433 0 0 0  0.558 0.442 0 0 0  0 0.242 0.758 0 0  0 0 0 1 0"/>
        </filter>
        <filter id="sc-deuteranopia" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="0.625 0.375 0 0 0  0.7 0.3 0 0 0  0 0.3 0.7 0 0  0 0 0 1 0"/>
        </filter>
        <filter id="sc-tritanopia" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="0.95 0.05 0 0 0  0 0.433 0.567 0 0  0 0.475 0.525 0 0  0 0 0 1 0"/>
        </filter>
      </defs>
    </svg>
</body>
</html>
